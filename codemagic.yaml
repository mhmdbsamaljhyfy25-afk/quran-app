workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix Android SDK
        script: |
          sed -i '' 's/compileSdk.*/compileSdk 36/' android/app/build.gradle || true
          sed -i '' 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle || true
      - name: Build APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
